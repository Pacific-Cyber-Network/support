name: Auto Invite Member

on:
  issues:
    types: [opened]

jobs:
  auto-invite:
    runs-on: ubuntu-latest
    steps:
      - name: Invite User to Organization
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ORG_INVITE_TOKEN }}
          script: |
            const username = context.payload.issue.user.login;
            const org = context.repo.owner;

            try {
              console.log(`Añadiendo a @${username} a la org...`);

              // 1. Añadir al usuario a la organización
              await github.rest.orgs.setMembershipForUser({
                org: org,
                username: username,
                role: 'member'
              });

              // 2. HACER LA MEMBRESÍA PÚBLICA AUTOMÁTICAMENTE
              await github.rest.orgs.setPublicMembershipForAuthenticatedUser({
                org: org,
                username: username
              });

              // 3. Comentario de bienvenida
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `👋 **Welcome @${username}!**\n\nYou have been automatically added to **${org}** and your membership is now public! Check your profile badge. 🌊`
              });

              // 4. Cerrar Issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: 'closed'
              });

            } catch (error) {
              console.error("ERROR DETALLADO:", error.message);

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `⚠️ Couldn't process auto-invite for @${username}. Please wait for an admin to process it manually.`
              });

              core.setFailed(error.message);
            }
