name: Auto Invite Member

on:
  issues:
    types: [opened]

jobs:
  auto-invite:
    runs-on: ubuntu-latest
    steps:
      - name: Invite User to Organization
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ORG_INVITE_TOKEN }}
          script: |
            const username = context.payload.issue.user.login;
            const org = context.repo.owner;

            try {
              console.log(`Intentando invitar a ${username} a la org ${org}...`);
              
              await github.rest.orgs.createOrUpdateMembershipForUser({
                org: org,
                username: username,
                role: 'member'
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `👋 **Welcome @${username}!**\n\nAn invitation to join **${org}** has been sent!`
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: 'closed'
              });

            } catch (error) {
              // ESTO MOSTRARÁ EL ERROR REAL EN LOS LOGS DE ACTIONS
              console.error("ERROR DETALLADO DE LA API:", error.message);
              console.error("STATUS CODE:", error.status);

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `⚠️ Couldn't process auto-invite for @${username}. Please wait for an admin to process it manually.`
              });
              
              // Hace que el workflow marque X roja para ver el log
              core.setFailed(error.message);
            }
