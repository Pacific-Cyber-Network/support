name: Auto Invite Member

on:
  issues:
    types: [opened]

jobs:
  auto-invite:
    runs-on: ubuntu-latest
    steps:
      - name: Invite User to Organization
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ORG_INVITE_TOKEN }}
          script: |
            const username = context.payload.issue.user.login;
            const org = context.repo.owner;

            try {
              console.log(`Enviando invitación a @${username}...`);

              // Método actualizado de Octokit / GitHub API
              await github.rest.orgs.setMembershipForUser({
                org: org,
                username: username,
                role: 'member'
              });

              // Mensaje de bienvenida
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `👋 **Welcome @${username}!**\n\nAn invitation to join **${org}** has been sent to your account! Check your GitHub notifications or email to accept it.\n\nEnjoy your new profile badge! 🌊`
              });

              // Cerrar Issue automáticamente
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: 'closed'
              });

            } catch (error) {
              console.error("ERROR DETALLADO:", error.message);

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `⚠️ Couldn't process auto-invite for @${username}. Please wait for an admin to process it manually.`
              });

              core.setFailed(error.message);
            }
