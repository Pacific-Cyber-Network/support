name: Auto Invite Member

on:
  issues:
    types: [opened]

jobs:
  auto-invite:
    runs-on: ubuntu-latest
    steps:
      - name: Invite User to Organization
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ORG_INVITE_TOKEN }}
          script: |
            const username = context.payload.issue.user.login;
            const org = context.repo.owner;

            try {
              console.log(`Sending official invitation to @${username}...`);

              // Sends the official organization invitation
              await github.rest.orgs.setMembershipForUser({
                org: org,
                username: username,
                role: 'member'
              });

              // Welcome comment in English
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `👋 **Welcome @${username}!**\n\nAn official invitation to join **${org}** has been sent to your account. Please check your GitHub notifications or go directly to https://github.com/orgs/${org}/invitation to accept it. Welcome! `
              });

              // Automatically close the issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: 'closed'
              });

            } catch (error) {
              console.error("DETAILED ERROR:", error.message);

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `⚠️ Couldn't process auto-invite for @${username}. Please wait for an admin to process it manually.`
              });

              core.setFailed(error.message);
            }
