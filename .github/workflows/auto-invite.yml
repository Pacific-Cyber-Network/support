name: Auto Invite Member

on:
  issues:
    types: [opened]

jobs:
  auto-invite:
    runs-on: ubuntu-latest
    steps:
      - name: Invite User to Organization
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ORG_INVITE_TOKEN }}
          script: |
            const username = context.payload.issue.user.login;
            const org = context.repo.owner;

            try {
              console.log(`Enviando invitación formal a @${username}...`);

              // Envía la invitación oficial a la organización
              await github.rest.orgs.setMembershipForUser({
                org: org,
                username: username,
                role: 'member'
              });

              // Comentario automático en el Issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `👋 **¡Hola @${username}!**\n\nTe hemos enviado una invitación automática para unirte a **${org}**[cite: 8]. Revisa tus notificaciones de GitHub o entra directamente a https://github.com/orgs/${org}/invitation para aceptarla. ¡Bienvenido al equipo! 🌊`
              });

              // Cierra el Issue automáticamente
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: 'closed'
              });

            } catch (error) {
              console.error("ERROR DETALLADO:", error.message);

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `⚠️ No se pudo procesar la invitación automática para @${username}. Un administrador lo revisará pronto.`
              });

              core.setFailed(error.message);
            }
