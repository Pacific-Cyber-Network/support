name: Auto Invite Member

on:
  issues:
    types: [opened]

jobs:
  invite:
    runs-on: ubuntu-latest
    steps:
      - name: Invite user to organization
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            👋 Welcome to **Pacific-Cyber-Network**!
            An invitation has been sent to join the organization. Please check your notifications or email to accept it! 🌊
